# =============================================================================
# agent-sandbox — the on-box world an EXTERNAL SRE agent is placed into.
#
# USE-CASE-NEUTRAL: this file names no use-case. The deploy-plane network and the
# app endpoint are passed in (DEPLOY_NETWORK, API_URL), so the same sandbox serves
# any use-case (booklogr supplies them via `pnpm forge agent booklogr`).
#
# This compose project IS THE AGENT'S ENTIRE WORLD. The engine/operator execs an
# external SRE agent's process INTO the already-running `agent-shell` container —
# the container idles on `sleep infinity`, and a human/engine runs
# `docker compose … exec agent-shell sh` from OUTSIDE to drop the agent in. The
# agent itself never runs docker (no socket, no CLI — see below). Inside, it polls
# Alertmanager, queries the observability stack (Prometheus / Grafana), reads the
# app, edits its per-run workspace clone, and submits.
#
# ISOLATION HAS TWO LAYERS:
#
#   (1) LATERAL — by omission (nothing to detect). agent-shell joins ONLY the
#       deploy-plane app network (${DEPLOY_NETWORK}). It is NOT on the forge
#       network and NOT on the load network, so the harness (Gitea forge, the
#       Actions runner, the k6 edge/load driver) is simply not routable — those
#       names don't resolve and those hosts have no route. The agent cannot tell a
#       staged eval rig exists because, from inside this box, it doesn't.
#       NO /var/run/docker.sock bind and NO docker CLI: the agent cannot enumerate
#       containers, networks, images, or labels. "What is running" is answerable
#       only through the documented HTTP endpoints below — the surface a real
#       responder is handed.
#
#   (2) EGRESS — a default-deny allowlist (init-firewall.sh, run by the root
#       entrypoint). The deploy-plane bridge has NAT, so WITHOUT this the agent
#       would have open internet (a retrieval hole: github / the public upstream
#       app / registries / search). The firewall seals outbound to everything
#       except the intra-plane (private) ranges and an explicit provider allowlist
#       (EMPTY by default ⇒ zero external egress). Unlike layer (1) this IS a
#       filter the agent can feel — a blocked reach times out — but: it is DROP not
#       REJECT, so a block looks like "no route" (the corp-firewall realism a real
#       on-call box has), and denial is a deliberate cheat-signal counted on the
#       EGRESS_BLOCKED chain (operator-readable via a root exec, agent-invisible).
#       The per-run allowlist is delivered via a root `docker exec -e` (NOT a
#       container env var), so it NEVER appears in the agent's environment.
#
# SUBMIT IS A HANDOFF TO THE ENGINE. The agent never pushes to the forge itself;
# it hands its proposed change to the orchestration engine, which is what owns
# the forge push / PR / CI. So this shell needs (and has) NO forge access at all.
#
# This is the MINIMAL ADR-0009 surface for the first increment: shell + documented
# HTTP endpoints + submit, with NO docker access. The "scoped real docker plane"
# (socket-proxy + docker-proxy-filter for app-only `docker ps`) is DEFERRED and
# documented in README.md, not built here.
#
# Bring up (the use-case's deploy plane + its app network must already exist):
#   DEPLOY_NETWORK=<plane>_default API_URL=http://<app>:<port> \
#     WORKSPACE_DIR=/abs/path/to/run-workspace-clone \
#     docker compose -p sreforge-agent -f infra/agent-sandbox/agent.yml up -d
#   docker compose -p sreforge-agent -f infra/agent-sandbox/agent.yml exec agent-shell sh
# (booklogr supplies these via `pnpm forge agent booklogr`.)
# =============================================================================

# Explicit, neutral project name. Distinct from the deploy plane, the forge
# (sreforge-forge), and the load plane.
name: sreforge-agent

services:
  agent-shell:
    # Neutral pre-baked image (agent-shell.Dockerfile): the responder's shell kit
    # (curl/git/jq/ca-certificates) AND the submit handoff are baked in at BUILD
    # time. This removes the observable runtime `apk add` step and the single-file
    # submit bind mount (a /proc/mounts tell, and broken on WSL2 + Rancher Desktop,
    # which resolves a single-file host bind as a directory — see the Dockerfile).
    # The image tag is neutral (no harness vocabulary). The agent has no docker in
    # the minimal sandbox, so image metadata is not agent-visible yet.
    build:
      context: .
      dockerfile: agent-shell.Dockerfile
      # Bake the `dev` user at the host workspace owner's uid/gid so the agent
      # (exec'd in with `-u $(id -u):$(id -g)`) maps to a real passwd entry and
      # /workspace git writes stay owner-consistent. These are BUILD args, not
      # runtime env — they never appear in the agent's environment.
      args:
        UID: "${AGENT_UID:-1000}"
        GID: "${AGENT_GID:-1000}"
    image: ops-shell:1
    container_name: agent-shell
    # No `user:` here — the container must START as root so the entrypoint can
    # program the egress firewall (CAP_NET_ADMIN), then it su-exec's down to the
    # non-root `dev` user for the idle process. The agent the operator execs in is
    # made non-root via `-u $(id -u):$(id -g)` (the Taskfile/README do this), which
    # also keeps /workspace git writes owner-consistent with the host engine.
    #
    # CAP_NET_ADMIN is the ONLY added capability — needed by the root entrypoint to
    # program iptables/ipset. The dropped agent is non-root, so it holds no
    # effective caps and cannot flush or inspect the rules (EPERM). The agent has
    # no docker, so this cap is not agent-visible.
    cap_add:
      - NET_ADMIN
    # Idle (sleep infinity, from the image CMD) so an external agent can be exec'd
    # in at any time. No runtime install step.
    restart: unless-stopped

    # ---- Network: the deploy plane ONLY ----------------------------------
    # Joining the deploy plane's app network (${DEPLOY_NETWORK}) gives the agent
    # service-DNS reach to the app + observability tier and NOTHING else. The
    # forge network and the load network are not joined, so sreforge-gitea /
    # sreforge-runner / edge-client are unreachable by omission.
    networks:
      - deploy_plane

    # ---- Workspace: per-run clone ONLY, at a neutral path ----------------
    # Read-write so the agent can edit and stage its fix. Sourced from
    # ${WORKSPACE_DIR} — the per-run workspace clone the engine prepared.
    # NEVER bind the harness repo (/home/sumit/sources/sreforge-workspace/sreforge):
    # that would expose the eval rig (compose files, injector, oracle, scripts).
    volumes:
      # The per-run workspace clone is the agent's ONLY mount — its whole edit
      # surface AND the only channel to the engine. The `submit` handoff is NOT
      # mounted; it is BAKED into the image (agent-shell.Dockerfile) at
      # /usr/local/bin/submit, which avoids the single-file-bind /proc/mounts tell
      # and the WSL2 + Rancher "not a directory" start failure. submit still
      # touches ONLY /workspace (commits the edits to a local branch + drops
      # /workspace/.sreforge/submit.json for the HOST engine to watch); it has NO
      # forge env, NO token, NO network — the boundary verify-boundary.sh asserts.
      - ${WORKSPACE_DIR:?set WORKSPACE_DIR to the per-run workspace clone}:/workspace:rw

    working_dir: /workspace

    environment:
      # ---- Documented endpoints (container-routable SERVICE DNS) ---------
      # These resolve over the deploy plane. They are the agent's whole
      # observability + app surface — no host ports, no harness hosts. PROM /
      # ALERTMANAGER / GRAFANA default to the stack-conventional service names;
      # API_URL is the use-case's app, so it is REQUIRED (no default to leak).
      PROM_URL: "${PROM_URL:-http://prometheus:9090}"
      ALERTMANAGER_URL: "${ALERTMANAGER_URL:-http://alertmanager:9093}"
      GRAFANA_URL: "${GRAFANA_URL:-http://grafana:3000}"
      API_URL: "${API_URL:?set API_URL to the deploy plane's app endpoint, e.g. http://booklogr-api:5000}"
      # NOTE: there is no Loki in this stack; observability is Prometheus +
      # Alertmanager + Grafana. LOKI_URL is intentionally omitted (telling the
      # agent a log store exists when it doesn't would itself be a tell). If a
      # Loki service is later added to the deploy plane, add LOKI_URL here.

      # ---- Submit = engine handoff (the real shim) -----------------------
      # `submit` is baked into the image at /usr/local/bin/submit
      # (agent-shell.Dockerfile). It commits the agent's
      # /workspace edits to a local branch and writes the completion sentinel
      # /workspace/.sreforge/submit.json — all on the shared mount, with NO forge,
      # NO push, NO network. The HOST engine (ExternalAgentRunner) watches the
      # sentinel, captures the diff, and owns the forge push / PR / CI.
      SUBMIT_CMD: "submit"

# The deploy plane's app network, created by the use-case's compose project.
# external: true — we ATTACH to it (by the name passed in DEPLOY_NETWORK); we do
# not own or recreate it.
networks:
  deploy_plane:
    external: true
    name: ${DEPLOY_NETWORK:?set DEPLOY_NETWORK to the deploy plane's app network, e.g. booklogr_default}
