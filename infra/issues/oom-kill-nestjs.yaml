id: oom-kill-nestjs
description: OOMKilled pod — memory limit too low for NestJS under load
severity: critical
alert_expected: PodOOMKilled
target_env: k8s

injection:
  target_repo: todo-app-ops-k8s
  target_file: helm/api/values.yaml
  commit_message: "chore: right-size API memory allocation to cut cloud costs"
  commit_author: "alex-devops <alex@todo-corp.example>"
  patch: |
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 96Mi

resolution:
  description: Increase memory limit to at least 256Mi for NestJS
  fix_file: helm/api/values.yaml
  hint: |
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 256Mi
  runbook: docs/runbooks/pod-oom-kill.md

validation:
  check: kubectl get pods -n todo-app
  expect_status: Running
  expect_no_restarts: true
