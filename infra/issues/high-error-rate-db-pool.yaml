id: high-error-rate-db-pool
description: High 5xx error rate — Prisma connection pool exhausted under load
severity: warning
alert_expected: HighTodoAppErrorRate
target_env: k8s

injection:
  target_repo: todo-app-ops-k8s
  target_file: helm/api/values.yaml
  commit_message: "chore: reduce DB pool size to limit database connections"
  commit_author: "sam-backend <sam@todo-corp.example>"
  patch: |
    env:
      - name: DATABASE_POOL_SIZE
        value: "2"
      - name: DATABASE_POOL_TIMEOUT
        value: "5000"

resolution:
  description: Increase DATABASE_POOL_SIZE to 20 (default Prisma pool is 10; 2 is too low under load)
  fix_file: helm/api/values.yaml
  hint: |
    env:
      - name: DATABASE_POOL_SIZE
        value: "20"
      - name: DATABASE_POOL_TIMEOUT
        value: "30000"
  runbook: docs/runbooks/high-error-rate.md

validation:
  check: "kubectl logs deployment/todo-app-api -n todo-app | grep -c PrismaClientKnownRequestError"
  expect_value: "0"
