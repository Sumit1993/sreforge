id: high-latency-missing-index
description: High p95 latency — missing index on todos.user_id causing full table scans
severity: warning
alert_expected: HighRequestLatency
target_env: k8s

injection:
  target_repo: todo-app-api-nestjs
  target_file: prisma/schema.prisma
  commit_message: "refactor: simplify Todo model, remove redundant indexes"
  commit_author: "sam-backend <sam@todo-corp.example>"
  patch: |
    # Remove @@index([userId]) and @@index([completed]) from Todo model
    # The patch removes these lines from the model block:
    #   @@index([userId])
    #   @@index([completed])
  patch_type: line-delete
  patch_lines:
    - "  @@index([userId])"
    - "  @@index([completed])"

resolution:
  description: Re-add @@index([userId]) and @@index([completed]) to the Todo model in prisma/schema.prisma
  fix_file: prisma/schema.prisma
  hint: |
    model Todo {
      ...
      @@index([userId])
      @@index([completed])
    }
  runbook: "../todo-app-ops-k8s/docs/runbooks/high-latency.md"

validation:
  check: "kubectl logs deployment/todo-app-api -n todo-app | grep -c Seq Scan on todos"
  expect_value: "0"
