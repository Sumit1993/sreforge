id: crashloop-spring-boot-probes
description: CrashLoopBackOff — NestJS-calibrated probe delays applied to Spring Boot API
severity: critical
alert_expected: PodCrashLooping
target_env: k8s

injection:
  target_repo: todo-app-ops-k8s
  target_file: helm/api/values.yaml
  commit_message: "chore: align probe timing with NestJS defaults"
  commit_author: "jordan-sre <jordan@todo-corp.example>"
  patch: |
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    livenessProbe:
      initialDelaySeconds: 10
      periodSeconds: 20
      failureThreshold: 3

resolution:
  description: Spring Boot needs initialDelaySeconds 30s (readiness) / 60s (liveness) for JVM startup
  fix_file: helm/api/values.yaml
  hint: |
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 3
    livenessProbe:
      initialDelaySeconds: 60
      periodSeconds: 20
      failureThreshold: 3
  runbook: docs/runbooks/crashloop-backoff.md

validation:
  check: kubectl get pods -n todo-app
  expect_status: Running
  expect_no_restarts: true
