name: nestjs-k8s-full
description: "Full NestJS stack on Kubernetes with complete monitoring"

api: nestjs
ui: nextjs
topology: kubernetes
target: local
namespace: todo-app

components:
  database:
    type: postgresql
    version: "16"
    storage: 10Gi
  cache:
    type: valkey
    version: "8"
    maxmemory: 64mb
  monitoring:
    prometheus: false
    grafana: false
    alertmanager: false

build:
  command: "turbo run build --filter=api"
  docker:
    context: ./apps/api
    file: ./apps/api/Dockerfile
    tag: "todo-app-api:{{git-sha}}"

deploy:
  method: helm
  chart: ./infra/helm/umbrella
  values:
    api.enabled: "true"
    api.image.repository: todo-app-api
    api.image.tag: "{{git-sha}}"
    api.replicaCount: "1"
    api.resources.requests.memory: 128Mi
    api.resources.requests.cpu: 100m
    api.resources.limits.memory: 256Mi
    api.readinessProbe.initialDelaySeconds: "5"
    api.livenessProbe.initialDelaySeconds: "15"
    api.autoscaling.targetCPUUtilizationPercentage: "70"
    ui.enabled: "true"
    ui.image.repository: todo-app-ui
    ui.image.tag: "{{git-sha}}"
    postgresql.enabled: "true"
    valkey.enabled: "true"
    gateway.enabled: "true"
    gateway.defaultBackend: nestjs

characteristics:
  startup_time: 3s
  memory_baseline: 120MB
  process_model: event-loop
  container_size: 150MB
  health_endpoint: /health
  metrics_endpoint: /metrics

applicable_issues:
  - nestjs-prisma-migration-timeout
  - nestjs-event-loop-blocking
  - nestjs-memory-heap-limit
  - k8s-oomkilled
  - k8s-hpa-thrashing
  - k8s-network-policy-block
  - db-connection-pool-full
  - db-slow-query-missing-index
  - cache-redis-maxmemory
  - deploy-helm-values-mismatch
  - container-node-heap
