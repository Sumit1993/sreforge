apiVersion: v2
name: todo-app
description: Umbrella chart for the Todo App platform
type: application
version: 0.1.0
appVersion: "1.0"

dependencies:
  - name: api
    version: "0.1.0"
    repository: "file://../api"
    condition: api.enabled
    alias: api

  - name: ui
    version: "0.1.0"
    repository: "file://../ui"
    condition: ui.enabled

  - name: postgresql
    version: "0.1.0"
    repository: "file://../postgresql"
    condition: postgresql.enabled

  - name: valkey
    version: "0.1.0"
    repository: "file://../valkey"
    condition: valkey.enabled

