{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "valkey.fullname" . }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
data:
  valkey.conf: |
    maxmemory {{ .Values.maxmemory }}
    maxmemory-policy {{ .Values.evictionPolicy }}
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
{{- end }}
