# Shared Git forge for SREForge use cases — Gitea + a self-hosted Actions runner.
# Long-lived and SEPARATE from any app deployment stack: the forge holds the
# imported substrate repos (one per use case) and persists across runs, while
# each app deployment is reset every run.
#
# It gives us, locally and with zero github.com:
#   - a real Git remote (the run workspace's `origin`, NOT the public upstream
#     — retrieval isolation, D13/D15),
#   - real PR + CI/CD via Gitea Actions (each repo carries its own
#     .gitea/workflows/ci.yml, installed by the use case's import-substrate.sh).
#
# Bring-up order (see the use case's scripts/import-substrate.sh):
#   1. docker compose -f infra/forge/forge.yml up -d gitea
#   2. create the admin user + a runner registration token
#   3. set GITEA_RUNNER_REGISTRATION_TOKEN in the use case .env, then up act_runner
#   4. import the substrate (mirror push) + push the instrumented baseline

# Explicit project name — this is the ONE shared forge for all use cases, not
# tied to any single stack; the name must be stable and unique.
name: sreforge-forge

services:
  gitea:
    image: docker.gitea.com/gitea:1.26.2
    container_name: sreforge-gitea
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__SSH_PORT: "222"
      # Enable Actions (CI/CD) globally; still must be enabled per-repo.
      GITEA__actions__ENABLED: "true"
      # Resolve `uses:` actions (e.g. actions/checkout@v4) from GitHub (reachable
      # here). Gitea 1.26 only accepts the keyword "github" (not a full URL).
      GITEA__actions__DEFAULT_ACTIONS_URL: github
      # Local single-instance forge: open it up for scripted setup.
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "false"
      # Require login to view any page/API — blocks ANONYMOUS user enumeration
      # (/api/v1/users/search, /explore/users) that would otherwise expose the
      # neutral `gitops` admin (+ its minute-fresh created timestamp). The agent's
      # run-ops token still authenticates, so its repo access is unaffected.
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
    volumes:
      - gitea-data:/data
      # NOTE: host /etc/timezone + /etc/localtime are intentionally NOT bind-mounted.
      # On WSL2 + Rancher Desktop /etc/localtime is a symlink (-> zoneinfo/Etc/UTC)
      # that the docker-mount layer resolves to a directory, so the bind fails with
      # "mount a directory onto a file" and Gitea won't start. Gitea defaults to UTC.
    ports:
      - "3000:3000"   # web UI + HTTP git
      - "222:22"      # SSH git (host 222 -> container 22)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  act_runner:
    build:
      context: .
      dockerfile: runner.Dockerfile
    image: sreforge-runner:local
    container_name: sreforge-runner
    restart: unless-stopped
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      # Must be set in the use case .env before the runner can register (the setup
      # generates it from Gitea, which has to be up first). Empty here so `up gitea`
      # alone still parses; an empty token just fails registration at runtime.
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:-}
      GITEA_RUNNER_NAME: actions-runner
      CONFIG_FILE: /config.yaml
    volumes:
      # NOTE: runner-config.yaml is intentionally NOT bind-mounted. On WSL2 +
      # Rancher Desktop a single-file host bind (-> /config.yaml) is staged through
      # the docker-mounts shim and resolves as a directory, so the bind fails
      # ("mount a directory onto a file") and the runner cannot be recreated after a
      # host cycle. It is baked into the image instead (runner.Dockerfile);
      # CONFIG_FILE=/config.yaml points at it.
      - act-runner-data:/data
      # Host Docker daemon — ci.yml's `docker build` runs on the host (the
      # runner maps ubuntu-latest to host execution; see runner-config.yaml).
      # Absolute well-known socket path: Rancher passes it through directly (not
      # via the docker-mounts shim), so it is not affected by the bind issue above.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gitea:
        condition: service_healthy

volumes:
  gitea-data:
  act-runner-data:
