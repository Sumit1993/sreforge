# scenario.toml — machine-readable manifest for the latency-retry-storm scenario.
#
# Taxonomy: engine (core) · use-case (todo-app) · stack (node-compose) · scenario (latency-retry-storm).
# This is an `incident`-profile scenario: the fault is injected against a LIVE deployment and
# verification is a behavioral closed loop (the alert must clear under still-active load), as opposed
# to the `patch` profile (static diff scored against a fixed test set).

# --- identity ------------------------------------------------------------------
id        = "latency-retry-storm"   # unique scenario id; matches the folder name
use_case  = "todo-app"              # product domain this scenario exercises
stack     = "node-compose"          # substrate: NestJS + Postgres + Valkey + Prometheus/Alertmanager/Grafana on Docker Compose
profile   = "incident"              # incident = live deploy + behavioral closed-loop oracle (NOT patch)
title     = "Latency retry storm under malformed-DELETE load"
difficulty = "easy"                 # easy | medium | hard — single-cause, localized fix
tags      = ["latency", "retry-storm", "error-handling", "input-validation"]

# One-paragraph description of the scenario (human-readable, neutral framing).
description = """
Sustained malformed DELETE requests against the Todo API drive p99 request latency above the
300ms SLO and trigger the TodoApiLatencyP99High alert. A non-integer id (e.g. DELETE /api/todos/abc)
is coerced to NaN and reaches Prisma as an invalid argument, raising a validation error. The service's
retry wrapper treats this non-transient error as retryable and re-runs the operation three times with
exponential backoff (~250ms of sleeps), so each doomed request spends ~270ms on the server before
returning HTTP 500. Under continuous malformed load this amplification pushes p99 to ~0.49s. The fix
must make malformed input fail fast (4xx, no retry) so latency returns under threshold while the load
is still running.
"""

# --- expected signal -----------------------------------------------------------
# The alert the agent is paged on and the SLO it encodes. Used by the confirm-fire gate and the oracle.
[expected]
alert                 = "TodoApiLatencyP99High"  # alert name in the Prometheus rule set
severity              = "critical"
p99_threshold_seconds = 0.3                       # alert fires when p99 > 0.3s sustained; baseline p99 <= 0.1s

# --- determinism / timing knobs ------------------------------------------------
# Harness timing contract. The confirm-fire gate proves the fault is live BEFORE the agent starts;
# the oracle requires the alert to stay cleared for sustained_clear_seconds under still-active load.
[determinism]
confirm_fire_timeout_seconds = 240   # max wait for TodoApiLatencyP99High to enter firing state under storm load
sustained_clear_seconds      = 30    # alert must remain cleared this long (load still active) to score as mitigated
alert_fired_at               = ""    # populated at runtime by the confirm-fire gate (RFC3339 timestamp of first firing)

# --- paths (relative to this scenario directory) -------------------------------
# All paths are relative to use-cases/todo-app/scenarios/latency-retry-storm/.
[paths]
stack    = "../../stacks/node-compose"                       # the live substrate this scenario deploys against
compose  = "../../stacks/node-compose/compose/docker-compose.yml"  # compose file the harness builds/redeploys with
trigger  = "trigger.md"                                      # the neutral on-call page handed to the agent
solution = "solution/reference-fix.md"                       # canonical reference fix (non-blocking diff hint)
oracle   = "verify/oracle.md"                                # v1 mitigation-oracle specification

# --- fault injection -----------------------------------------------------------
# How the harness makes the incident happen. The load driver lives in the stack dir and runs the
# malformed-DELETE storm. CRITICAL: this load runs CONTINUOUSLY and is NEVER stopped during
# verification — the alert may only clear because the deployed fix works, never because load stopped.
[inject]
command  = "node load/driver.mjs --mode=storm --rps=1.5"   # run from the stack dir; sustained malformed-DELETE traffic, held UNDER the app's ~100/min rate-limit so the slow 500s are steady (not bursty)
mode     = "storm"
continuous = true                                 # driver runs for the full run lifecycle (confirm-fire + agent work + verify)
stop_during_verification = false                  # anti-cheat (D4): load stays active while the oracle scores

# --- verification (v1 mitigation oracle) ---------------------------------------
# Multi-signal, objective, no-LLM oracle. v1 ships mitigation only; diagnosis/RCA judge is deferred to v2.
# Full contract and measurement details in verify/oracle.md.
[verify]
oracle           = "mitigation"   # v1 oracle family; CompoundedOracle drops in detect/diagnose later without refactor
signals          = [
  "ci_green",          # nest build succeeds + api jest suite passes (CI gate before auto-merge/redeploy)
  "alert_cleared",     # TodoApiLatencyP99High absent from the Prometheus firing set after redeploy
  "sustained_clear",   # stays cleared for sustained_clear_seconds while storm load is still running
  "time_to_clear",     # seconds from redeploy to clear (recorded, not pass/fail)
  "no_new_alerts",     # no other alert transitions to firing post-fix (regression guard)
]
load_active_during_scoring = true   # restates the D4 anti-cheat at the verify boundary
