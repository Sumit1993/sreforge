# Prometheus config for the local node-compose closed loop.
# Scrapes the API over the compose network (http, internal DNS), loads the
# SREForge alert rules, and routes firing alerts to Alertmanager.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'todo-app-api'
    metrics_path: /api/metrics
    static_configs:
      - targets: ['api:3000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
