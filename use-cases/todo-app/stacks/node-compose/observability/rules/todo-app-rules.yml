# SREForge v1 alert rules for the todo-api service.
#
# Primary signal for the `latency-retry-storm` scenario is TodoApiLatencyP99High.
# Thresholds are tuned to the validated behaviour of the planted incident:
#   - healthy baseline p99 stays <= ~0.1s
#   - under the malformed-DELETE retry storm, each bad request costs ~270ms of
#     retry backoff, so p99 interpolates to ~0.49s within the (0.1, 0.5] bucket
# A threshold of 0.3s cleanly separates incident from healthy with margin both
# ways. Histogram buckets are [0.1, 0.5, 1, 2, 5]; labels are method/route/status;
# the `job` label is added by Prometheus scrape config.
groups:
  - name: todo-app-api.rules
    rules:
      - alert: TodoApiLatencyP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{job="todo-app-api"}[30s]))) > 0.3
        for: 30s
        labels:
          severity: critical
          service: todo-api
        annotations:
          summary: "High p99 request latency on todo-api"
          description: "p99 HTTP request latency is {{ $value | humanizeDuration }} (threshold 300ms) for the todo-api service."

      # Secondary signal — the retry storm also surfaces as 5xx. After the fix the
      # malformed request becomes a fast 4xx, so this clears alongside the latency
      # alert (used by the oracle's no-new-alerts / no-regression check).
      - alert: TodoApiHighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="todo-app-api", status=~"5.."}[1m]))
            /
            clamp_min(sum(rate(http_requests_total{job="todo-app-api"}[1m])), 1e-9)
          ) > 0.05
        for: 30s
        labels:
          severity: warning
          service: todo-api
        annotations:
          summary: "Elevated 5xx error rate on todo-api"
          description: "5xx error ratio is {{ $value | humanizePercentage }} (threshold 5%) for the todo-api service."

      # Sanity — the scrape target is unreachable.
      - alert: TodoApiDown
        expr: up{job="todo-app-api"} == 0
        for: 30s
        labels:
          severity: critical
          service: todo-api
        annotations:
          summary: "todo-api is down"
          description: "Prometheus has been unable to scrape todo-api for 30s."
