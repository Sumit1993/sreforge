# Alertmanager config for the local node-compose closed loop.
# v1 routes everything to a null receiver — the harness reads alert state from
# Prometheus /api/v1/alerts directly (deterministic, no group_wait latency).
# Alertmanager is still wired so the agent sees a realistic alerting surface.
global:
  resolve_timeout: 1m

route:
  group_by: ['alertname', 'service']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'null'

receivers:
  - name: 'null'
