# scenario.toml — machine-readable manifest for the db-pool-exhaustion-deploy scenario.
#
# Taxonomy: engine (core) · use-case (booklogr) · stack (flask-compose) · scenario (db-pool-exhaustion-deploy).
# This is an `incident`-profile scenario: the fault is injected against a LIVE deployment and
# verification is a behavioral closed loop (the alert must clear under still-active load), as opposed
# to the `patch` profile (static diff scored against a fixed test set).

# --- identity ------------------------------------------------------------------
id        = "db-pool-exhaustion-deploy"   # BINDING — unique scenario id; matches the folder name
use_case  = "booklogr"                 # BINDING — product domain this scenario exercises
stack     = "flask-compose"            # BINDING — substrate: Flask + Gunicorn + Prometheus/Alertmanager/Grafana on Docker Compose
profile   = "incident"                 # ARCHETYPE — incident = live deploy + behavioral closed-loop oracle (NOT patch)
title     = "DB pool exhaustion blocks workers on uncached reads"  # BINDING — human-readable scenario title
difficulty = "medium"                  # ARCHETYPE — easy | medium | hard — single-cause, localized single-line fix, but one hop removed from hot endpoint
tags      = ["latency", "database", "connection-pool", "deploy-correlation"]  # BINDING — fault-class tags

# One-paragraph description of the scenario (human-readable, neutral framing).
description = """
A recent deploy-time configuration change reduces the SQLAlchemy database connection pool to a single connection and
switches the Gunicorn worker model to threaded (gthread, threads=8). The uncached `/v1/books` library list route hits
Postgres on every request. Under moderate library-read load, concurrent request threads within a worker process pile up
on that process's single database connection, serializing all uncached reads. As threads block on database I/O, the
workers become starved, causing even cached endpoints like `/v1/books/search` to queue and time out. This drives p99
request latency above the 300ms SLO and triggers the BooklogrApiLatencyP99High alert. The fix must restore a sufficient
database connection pool size so that database reads can proceed concurrently and Gunicorn workers do not back up.
"""

# --- expected signal -----------------------------------------------------------
# The alert the agent is paged on and the SLO it encodes. Used by the confirm-fire gate and the oracle.
[expected]
alert                 = "BooklogrApiLatencyP99High"  # BINDING — alert name in the Prometheus rule set
severity              = "critical"                    # ARCHETYPE — paging severity
p99_threshold_seconds = 0.3                           # ARCHETYPE — alert fires when p99 > 0.3s for 30s; healthy baseline well under 100ms

# PromQL used by the confirm-fire gate and oracle to evaluate the alert signal.
# Metric: flask_http_request_duration_seconds_bucket; scrape job label job="booklogr-api".
# BINDING — this stack exports the flask_-prefixed metric; do NOT substitute the bare http_request_duration_seconds_bucket.
p99_promql = """
histogram_quantile(0.99, sum by (le) (rate(flask_http_request_duration_seconds_bucket{job="booklogr-api"}[30s])))
"""

# --- determinism / timing knobs ------------------------------------------------
# Harness timing contract. The confirm-fire gate proves the fault is live BEFORE the agent starts;
# the oracle requires the alert to stay cleared for sustained_clear_seconds under still-active load.
[determinism]
confirm_fire_timeout_seconds = 240   # ARCHETYPE — max wait for BooklogrApiLatencyP99High to enter firing state under storm load
sustained_clear_seconds      = 360   # ARCHETYPE — must stay cleared this long (load still active) to score as mitigated; > substrate cache TTL 300s so cache-masking cannot pass (#66)
alert_fired_at               = ""    # populated at runtime by the confirm-fire gate (RFC3339 timestamp of first firing)

# --- paths (relative to this scenario directory) -------------------------------
# All paths are relative to use-cases/booklogr/scenarios/db-pool-exhaustion-deploy/.
# The booklogr compose lives IN-REPO at stacks/flask-compose/compose — not an external sibling repo.
[paths]
stack    = "../../stacks/flask-compose"                          # BINDING — harness-side run layer for this substrate
compose  = "../../stacks/flask-compose/compose/docker-compose.yml"  # BINDING — in-repo compose file (not an external ops repo)
solution = "solution/fix.patch"                                 # BINDING — canonical reference fix (harness-internal, not agent-facing)
oracle   = "verify/oracle.md"                                    # BINDING — v1 mitigation-oracle specification (harness-internal)

# --- fault injection -----------------------------------------------------------
# How the harness makes the incident happen. The fault is a two-file change: api/config.py
#   SQLALCHEMY_ENGINE_OPTIONS = {"pool_size": 1, "max_overflow": 0, "pool_timeout": 5}
# plus gunicorn.conf.py switching workers from the implicit sync class to threaded
# (worker_class = "gthread", threads = 8). The threading change is load-bearing: gunicorn's
# default sync workers each process one request at a time, so a shrunk pool is never actually
# contended without it (a single-process pool_size=1 exactly matches the max 1-concurrent-request
# ceiling a sync worker already has).
# This is an arm-deploy-recent scenario. The orchestrator resets the origin/main
# to a healthy baseline (baseline^), applies the fault patch (inject/fault.patch), 
# commits it with the author identity to simulate a real recent deployment, and 
# pushes to origin/main. This uses the `fault_delivery_arm_deploy_recent` function 
# from `scripts/lib-fault-delivery.sh`, pulling config from `scenario.env`.
# The load driver is k6 running a constant-arrival-rate storm of uncached GET /v1/books
# library-list reads (booklogr-storm-mixed.js) over the seeded library. CRITICAL: load
# runs CONTINUOUSLY and is NEVER stopped during verification.
[inject]
command  = "docker compose -p booklogr-edge -f compose/load.yml up -d"
mode     = "storm"                    # ARCHETYPE — constant-arrival-rate storm over fixed query working set
continuous = true                     # ARCHETYPE — driver runs for the full run lifecycle (confirm-fire + agent work + verify)
stop_during_verification = false      # ARCHETYPE — anti-cheat (ADR-0004): load stays active while the oracle scores

# --- verification (v1 mitigation oracle) ---------------------------------------
# Multi-signal, objective, no-LLM oracle. v1 ships mitigation only; diagnosis/RCA judge is deferred to v2.
# Full contract and measurement details in verify/oracle.md.
# Acceptable fix families: Revert the pool-limiting commit; raise pool_size/max_overflow back to headroom
# above the storm's concurrent-read demand; remove the SQLALCHEMY_ENGINE_OPTIONS override entirely; or
# revert the gunicorn worker_class/threads change back to sync workers.
# The oracle grades observed behavior, NOT a diff match against solution/fix.patch.
[verify]
oracle           = "mitigation"       # ARCHETYPE — oracle family; compound oracle drops in detect/diagnose later without refactor
pass_threshold   = 0.85               # ARCHETYPE — weighted score must reach 0.85 to pass
load_active_during_scoring = true     # ARCHETYPE — anti-cheat (ADR-0004): load stays active while the oracle scores
  # Services whose firing alerts count toward the no_new_alerts regression signal.
  # Book-metadata is NOT a signal in this scenario — its alert is out of scope so a
  # cross-service false-positive can never dock this grade (PR #71 smoke finding).
  services = ["booklogr-api"]   # BINDING — grader scope for no_new_alerts

# Signal weights (must sum to 1.0). Three HARD signals (ci_green + alert_cleared + sustained_clear = 0.80)
# plus soft credit. A fix that clears the alert briefly but does NOT sustain under active storm scores
# <=0.80 and fails — that is the ADR-0004 anti-cheat. Fail-closed short-circuits: CI not green, or service
# not redeployed after the fix commit.
signals          = [
  "ci_green",          # BINDING — Gitea Actions ci.yml: docker build booklogr-api image + container smoke test (GET /); booklogr ships NO unit tests — CI proves deployability, not correctness
  "alert_cleared",     # ARCHETYPE — BooklogrApiLatencyP99High absent from the Prometheus firing set after redeploy
  "sustained_clear",   # ARCHETYPE — stays cleared for sustained_clear_seconds while k6 storm load is still running
  "time_to_clear",     # ARCHETYPE — seconds from redeploy to clear (recorded for telemetry, not a hard pass/fail gate)
  "no_new_alerts",     # ARCHETYPE — no other alert (BooklogrApiHighErrorRate, BooklogrApiDown) transitions to firing post-fix
]

# Signal weights used by the compound oracle (must match verify/oracle.md).
[verify.weights]
ci_green          = 0.25   # ARCHETYPE
alert_cleared     = 0.35   # ARCHETYPE
sustained_clear   = 0.20   # ARCHETYPE
time_to_clear     = 0.10   # ARCHETYPE
no_new_alerts     = 0.10   # ARCHETYPE

# --- endpoints (harness-internal reference, not agent-facing) ------------------
# Prometheus-flask-exporter aggregated (multiprocess) metrics on a DEDICATED port booklogr-api:9090,
# NOT on /metrics at :5000.
[endpoints]
prometheus   = "http://localhost:9090"   # BINDING — Prometheus UI / query API
alertmanager = "http://localhost:9093"   # BINDING — Alertmanager UI
grafana      = "http://localhost:3002"   # BINDING — Grafana dashboards
api          = "http://localhost:5000"   # BINDING — booklogr Flask API (book endpoints; single-user, no auth required)
web          = "http://localhost:5150"   # BINDING — booklogr web frontend
