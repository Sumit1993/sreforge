# scenario.toml — machine-readable manifest for the worker-cpu-starvation scenario.
#
# Taxonomy: engine (core) · use-case (booklogr) · stack (flask-compose) · scenario (worker-cpu-starvation).
# This is an `incident`-profile scenario: the fault is injected against a LIVE deployment and
# verification is a behavioral closed loop (the alert must clear under still-active load), as opposed
# to the `patch` profile (static diff scored against a fixed test set).
#
# CERTIFICATION PENDING (ADR-0026): this scenario ships authored but NOT certified. No acceptance.json,
# no headroom.md, no recorded fire times exist yet — they must come from real certification runs.
# See README.md "CERTIFICATION PENDING" for the exact live evidence still required.

# --- identity ------------------------------------------------------------------
id        = "worker-cpu-starvation"    # BINDING — unique scenario id; matches the folder name
use_case  = "booklogr"                 # BINDING — product domain this scenario exercises
stack     = "flask-compose"            # BINDING — substrate: Flask + Gunicorn + Prometheus/Alertmanager/Grafana on Docker Compose
profile   = "incident"                 # ARCHETYPE — incident = live deploy + behavioral closed-loop oracle (NOT patch)
title     = "Worker pool CPU-starved by full-library re-sort on the hot read path"  # BINDING — human-readable scenario title
difficulty = "hard"                    # ARCHETYPE — easy | medium | hard — structurally hard: a multi-service alert storm that must be grouped into ONE incident with a shared cause
tags      = ["latency", "cpu", "worker-starvation", "storm", "multi-alert", "deploy-correlation"]  # BINDING — fault-class tags

# One-paragraph description of the scenario (human-readable, harness-internal — NOT the agent brief;
# the ContextAssembler renders the neutral agent brief from the alert + live endpoints, not from this).
description = """
A recent deploy-time change to the `/v1/books` library-list route replaced the database-side ORDER BY +
LIMIT/OFFSET pagination with an in-application "shelf ordering" pass: it now materializes the owner's ENTIRE
library (150k seeded rows) as ORM objects and Unicode-normalizes + sorts them in Python on every request
before slicing out the requested page. The work is CPU-bound (ORM hydration of the full result set plus a
per-row article-insensitive / accent-folded sort key), so under the constant-arrival-rate library-read storm
all four Gunicorn workers saturate their CPU. Once the workers are pinned, EVERY endpoint queues at accept —
including cached routes like `/v1/books/search` and book-detail lookups — so p99 request latency climbs well
past the 300ms SLO and fires BooklogrApiLatencyP99High. Because the starved API can no longer drive its normal
call volume to the book-metadata provider, that downstream service's inbound request traffic collapses,
firing a second, cross-service signal (service=book-metadata). Grouping these signals into a single incident
with a shared cause is the point of this scenario. The fix must stop the per-request full-library re-sort so
the read path returns to database-side pagination and the workers are no longer CPU-starved.
"""

# --- expected signal -----------------------------------------------------------
# The alert the agent is paged on and the SLO it encodes. Used by the confirm-fire gate and the oracle.
# UNCHANGED from the existing booklogr-rules.yml primary latency alert — this scenario does NOT edit that file.
[expected]
alert                 = "BooklogrApiLatencyP99High"  # BINDING — alert name in the existing Prometheus rule set (booklogr-rules.yml, unchanged)
severity              = "critical"                    # ARCHETYPE — paging severity
p99_threshold_seconds = 0.3                           # ARCHETYPE — alert fires when p99 > 0.3s for 30s; healthy baseline well under 100ms

# PromQL used by the confirm-fire gate and oracle to evaluate the alert signal.
# Metric: flask_http_request_duration_seconds_bucket; scrape job label job="booklogr-api".
# BINDING — this stack exports the flask_-prefixed metric; do NOT substitute the bare http_request_duration_seconds_bucket.
p99_promql = """
histogram_quantile(0.99, sum by (le) (rate(flask_http_request_duration_seconds_bucket{job="booklogr-api"}[30s])))
"""

# --- determinism / timing knobs ------------------------------------------------
# Harness timing contract. The confirm-fire gate proves the fault is live BEFORE the agent starts;
# the oracle requires the alert to stay cleared for sustained_clear_seconds under still-active load.
[determinism]
confirm_fire_timeout_seconds = 240   # ARCHETYPE — max wait for BooklogrApiLatencyP99High to enter firing state under storm load (CPU saturation fires fast; kept at db-pool's 240)
sustained_clear_seconds      = 360   # ARCHETYPE — must stay cleared this long (load still active) to score as mitigated; > substrate cache TTL 300s so cache-masking cannot pass (#66)
alert_fired_at               = ""    # populated at runtime by the confirm-fire gate (RFC3339 timestamp of first firing)

# --- paths (relative to this scenario directory) -------------------------------
# All paths are relative to use-cases/booklogr/scenarios/worker-cpu-starvation/.
[paths]
stack    = "../../stacks/flask-compose"                          # BINDING — harness-side run layer for this substrate
compose  = "../../stacks/flask-compose/compose/docker-compose.yml"  # BINDING — in-repo compose file (not an external ops repo)
solution = "solution/fix.patch"                                 # BINDING — canonical reference fix (harness-internal, not agent-facing)
oracle   = "verify/oracle.md"                                    # BINDING — v1 mitigation-oracle specification (harness-internal)

# --- fault injection -----------------------------------------------------------
# How the harness makes the incident happen. The fault is a single-file change to
# api/routes/books.py (get_books): the DB-side ORDER BY + paginate is replaced with a full-library
# materialize-normalize-sort-in-Python pass. Reverting the commit (solution/fix.patch) restores
# database-side pagination.
# This is an arm-deploy-recent scenario. The orchestrator resets origin/main to a healthy baseline
# (baseline^), applies the fault patch (inject/fault.patch), commits it with the author identity to
# simulate a real recent deployment, and pushes to origin/main. This uses the
# `fault_delivery_arm_deploy_recent` function from `scripts/lib-fault-delivery.sh`, pulling config from
# scenario.env.
# The load driver is k6 running a constant-arrival-rate BROWSE-MIXED storm (booklogr-storm-browse-mixed.js):
# a dominant stream of uncached GET /v1/books library-list reads (the CPU-saturating path) plus a low-rate
# stream of uncached book-detail lookups that route through the book-metadata provider (the cross-service
# coupling). CRITICAL: load runs CONTINUOUSLY and is NEVER stopped during verification.
[inject]
command  = "docker compose -p booklogr-edge -f compose/load.yml up -d"
mode     = "storm"                    # ARCHETYPE — constant-arrival-rate storm over fixed query working set
continuous = true                     # ARCHETYPE — driver runs for the full run lifecycle (confirm-fire + agent work + verify)
stop_during_verification = false      # ARCHETYPE — anti-cheat (ADR-0004): load stays active while the oracle scores

# --- verification (v1 mitigation oracle) ---------------------------------------
# Multi-signal, objective, no-LLM oracle. v1 ships mitigation only; diagnosis/RCA judge is deferred to v2.
# IDENTICAL signal set and weights to db-pool-exhaustion-deploy — the mitigation oracle is UNCHANGED.
# The cross-service book-metadata storm signal is NOT a verify signal (diagnosis/storm-grouping is the
# #56 judge's job, never a mitigation gate). Full contract and measurement details in verify/oracle.md.
# Acceptable fix families: revert the shelf-ordering commit; restore database-side ORDER BY + LIMIT/OFFSET
# pagination; or otherwise stop the per-request full-library materialize/sort so the read path no longer
# pins the workers' CPU. The oracle grades observed behavior, NOT a diff match against solution/fix.patch.
[verify]
oracle           = "mitigation"       # ARCHETYPE — oracle family; compound oracle drops in detect/diagnose later without refactor
qualification_mode = "score-headroom"  # ARCHETYPE — score-headroom (mitigation median vs 0.8 threshold governs qualification)
pass_threshold   = 0.85               # ARCHETYPE — weighted score must reach 0.85 to pass
load_active_during_scoring = true     # ARCHETYPE — anti-cheat (ADR-0004): load stays active while the oracle scores
  # Both services are in scope: book-metadata's rate collapse/recovery is a legitimate
  # coupled signal here — a correct fix restores provider traffic and clears the alert;
  # if it stays stalled post-fix that is a real regression and must count.
  services = ["booklogr-api", "book-metadata"]   # BINDING — grader scope for no_new_alerts

# Signal weights (must sum to 1.0). Three HARD signals (ci_green + alert_cleared + sustained_clear = 0.80)
# plus soft credit. A fix that clears the alert briefly but does NOT sustain under active storm scores
# <=0.80 and fails — that is the ADR-0004 anti-cheat. Fail-closed short-circuits: CI not green, or service
# not redeployed after the fix commit.
signals          = [
  "ci_green",          # BINDING — Gitea Actions ci.yml: docker build booklogr-api image + container smoke test (GET /); booklogr ships NO unit tests — CI proves deployability, not correctness
  "alert_cleared",     # ARCHETYPE — BooklogrApiLatencyP99High absent from the Prometheus firing set after redeploy
  "sustained_clear",   # ARCHETYPE — stays cleared for sustained_clear_seconds while k6 storm load is still running
  "time_to_clear",     # ARCHETYPE — seconds from redeploy to clear (recorded for telemetry, not a hard pass/fail gate)
  "no_new_alerts",     # ARCHETYPE — no other alert (BooklogrApiHighErrorRate, BooklogrApiDown) transitions to firing post-fix
]

# Signal weights used by the compound oracle (must match verify/oracle.md). UNCHANGED from db-pool.
[verify.weights]
ci_green          = 0.25   # ARCHETYPE
alert_cleared     = 0.35   # ARCHETYPE
sustained_clear   = 0.20   # ARCHETYPE
time_to_clear     = 0.10   # ARCHETYPE
no_new_alerts     = 0.10   # ARCHETYPE

# --- endpoints (harness-internal reference, not agent-facing) ------------------
# Prometheus-flask-exporter aggregated (multiprocess) metrics on a DEDICATED port booklogr-api:9090,
# NOT on /metrics at :5000.
[endpoints]
prometheus   = "http://localhost:9090"   # BINDING — Prometheus UI / query API
alertmanager = "http://localhost:9093"   # BINDING — Alertmanager UI
grafana      = "http://localhost:3002"   # BINDING — Grafana dashboards
api          = "http://localhost:5000"   # BINDING — booklogr Flask API (book endpoints; single-user, no auth required)
web          = "http://localhost:5150"   # BINDING — booklogr web frontend
