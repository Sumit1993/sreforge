# Build the API image and smoke-test that the service boots and serves its
# index route, on every push and pull request. booklogr ships no framework unit
# tests, so CI is build + boot smoke.
name: CI
on:
  push:
    branches: ['**']   # any branch, not tag pushes
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t booklogr-api-ci:${{ gitea.sha }} .

      - name: Smoke test — API boots and serves /
        run: |
          set -e
          name="smoke-${{ gitea.sha }}"
          docker run -d --name "$name" \
            -e SINGLE_USER_MODE=true \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            -e AUTH_SECRET_KEY=ci-smoke \
            booklogr-api-ci:${{ gitea.sha }}
          ok=
          for i in $(seq 1 30); do
            if docker exec "$name" python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3).status==200 else 1)" 2>/dev/null; then
              echo "smoke OK after ${i} tries"; ok=1; break
            fi
            sleep 2
          done
          docker logs "$name" || true
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker rmi booklogr-api-ci:${{ gitea.sha }} >/dev/null 2>&1 || true
          test "$ok" = "1"
