# act_runner config for the booklogr forge.
#
# The key choice: run `ubuntu-latest` jobs directly on the HOST (`:host` label
# mapping) rather than inside a job container. This is what lets `docker build`
# in ci.yml use the host Docker daemon (the act_runner service bind-mounts
# /var/run/docker.sock). Running jobs in a nested container would otherwise need
# docker-in-docker plumbing.
#
# Mounted into the act_runner container at /config.yaml; referenced by
# CONFIG_FILE=/config.yaml in compose/forge.yml.
log:
  level: info

runner:
  capacity: 1
  timeout: 30m
  # Map the conventional GitHub label to host execution: job steps run in THIS
  # runner container (equipped by runner.Dockerfile with docker-cli, git, node
  # and bash) rather than spawning a fresh per-job container.
  labels:
    - "ubuntu-latest:host"

container:
  # Unused in host mode, but kept valid for any container-mode jobs.
  network: ""
  privileged: false
