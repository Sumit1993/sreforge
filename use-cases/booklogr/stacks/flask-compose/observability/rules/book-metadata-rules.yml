# Alert rules for the self-hosted book-metadata provider (the custom-URL data
# provider the booklogr API calls). These are HARNESS observability over our own
# stub, exposed via prometheus_client on book-metadata:8080/metrics and scraped by
# the job_name: 'book-metadata' scrape config in prometheus.yml.
#
# This is a NEW rules file (scenario worker-cpu-starvation own_additions). It does
# NOT touch observability/rules/booklogr-rules.yml. Metric names are the stub's:
#   book_metadata_requests_total     counter, label endpoint (edition|work|search)
#   book_metadata_inflight_requests  gauge, concurrent in-flight handlers
#   book_metadata_request_duration_seconds  histogram, handler wall-clock
#
# Cross-service physics (see verify/oracle.md "Root cause (harness-internal)"):
# the API is this provider's sole consumer. When the API's request workers are
# saturated, browse/detail requests pile up in the API's accept queue and never
# reach the point of calling the provider, so the provider's INBOUND request rate
# collapses. (In-flight PILEUP does not occur: the provider's response bodies are
# tiny, so a slow-reading starved client never blocks the provider's socket
# write — there is no backpressure to pile up on. Rate collapse is the signal
# that genuinely moves.)
#
# ALL thresholds and windows below are PROVISIONAL and MUST be tuned against live
# certification soak data before this scenario is certified.  # TUNE-ON-CERT
groups:
  - name: book-metadata
    rules:
      - alert: BookMetadataTrafficStalled
        # Fires when the provider WAS serving steady traffic (min-baseline qualifier)
        # but its inbound request rate has since collapsed to below a ratio of its
        # trailing baseline (collapse ratio). This keeps it quiet for scenarios that
        # simply never exercise the provider (idle/no baseline), so it only fires on
        # an active-then-stalled transition.
        #
        # THIRD QUALIFIER — min sample count (#95). The two qualifiers above are not
        # enough on a freshly-recreated Prometheus. `quiesce` wipes the TSDB by
        # force-recreating Prometheus, and `rate(...[30m] offset 2m)` will happily
        # extrapolate a full-window rate from the handful of residual scrapes taken
        # while the previous deployment was still up. That satisfies the > 0.15
        # min-baseline from data which is an artifact of the wipe, while the current
        # [2m] rate is legitimately 0 because quiesce just stopped the load — so the
        # alert pends on exactly the state the quiesce gate itself creates, and
        # `confirm-quiesced` (which requires 0 pending) can never settle. That
        # deadlocked 11/21 runs of the 2026-07-22 campaign.
        #
        # At the stack's 5s scrape_interval a fully-covered 30m window holds ~360
        # samples; the sparse post-recreate case in #95 had ~24 (about two minutes).
        # Requiring > 120 demands ~10 minutes of real history before the collapse
        # comparison is allowed to arm at all, which no post-wipe TSDB can fake.
        # `max()` over the per-endpoint series asks "does any series have real
        # history", which is the question that matters.  # TUNE-ON-CERT
        expr: |
          (
            sum(rate(book_metadata_requests_total{job="book-metadata"}[2m]))
            <
            0.4 * sum(rate(book_metadata_requests_total{job="book-metadata"}[30m] offset 2m))
          )
          and
          (
            sum(rate(book_metadata_requests_total{job="book-metadata"}[30m] offset 2m)) > 0.15
          )
          and
          (
            max(count_over_time(book_metadata_requests_total{job="book-metadata"}[30m] offset 2m)) > 120
          )
        for: 2m                       # TUNE-ON-CERT — sustained-collapse window (unchanged)
        labels:
          service: book-metadata      # distinct service -> distinct storm group from booklogr-api
          severity: warning
        annotations:
          summary: "book-metadata inbound request traffic has stalled"
          description: >-
            The book-metadata provider was serving steady traffic but its inbound
            request rate has collapsed. Its upstream consumer appears to have stopped
            driving normal call volume.
        # Provisional numbers: current-2m rate vs 30m-trailing baseline (baseline window/offset),
        # collapse ratio 0.4, min-baseline 0.15 req/s, 2m sustain. All  # TUNE-ON-CERT  against real soak data.

      - alert: BookMetadataProviderErrorsElevated
        expr: |
          (
            sum(rate(book_metadata_provider_errors_total{job="book-metadata"}[1m]))
            /
            clamp_min(sum(rate(book_metadata_requests_total{job="book-metadata"}[1m])), 1e-9)
          ) > 0.05
        for: 1m                              # TUNE-ON-CERT — sustain window
        labels:
          service: book-metadata             # OUT of this scenario's grader scope
          severity: warning
        annotations:
          summary: "Elevated error rate from the book-metadata provider"
          description: >-
            The book-metadata provider is returning an elevated share of 5xx
            responses on metadata lookups.

