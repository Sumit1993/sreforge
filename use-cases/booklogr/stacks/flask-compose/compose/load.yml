# Isolated load plane.
#
# Kept in its OWN compose project (booklogr-edge), SEPARATE from the booklogr
# deployment, so the synthetic load driver is never part of what an agent
# enumerates as "the deployment" (de-tell). Traffic enters through the API's
# published ingress (host port 5000) exactly as an external client would, rather
# than the internal service network — so the driver does not even join the app
# network. The neutral name `edge-client` reads as a client/edge tier, not a rig.
#
# On-demand only: brought up by scripts/arm-incident.sh, torn down by down.sh.
#
#   docker compose -p booklogr-edge -f compose/load.yml up -d
#   docker compose -p booklogr-edge -f compose/load.yml down
name: booklogr-edge

services:
  edge-client:
    image: grafana/k6:latest
    container_name: edge-client
    command: ["run", "/scripts/${STORM_SCRIPT:-booklogr-storm.js}"]
    environment:
      # Hit the published API ingress on the host, like any external client.
      API_URL: ${API_URL:-http://host.docker.internal:5000}
      RATE: ${RATE:-25}
      RATE_SEARCH: ${RATE_SEARCH:-2}
    extra_hosts:
      # Make host.docker.internal resolvable on Linux / WSL2 + Rancher Desktop.
      - "host.docker.internal:host-gateway"
    volumes:
      - ../load:/scripts:ro
