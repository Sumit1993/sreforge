# =============================================================================
# mcp.yml — the per-use-case MCP TELEMETRY SEAM (ADR-0018 §3).
#
# WHAT THIS IS
#   A read-only, off-the-shelf Grafana MCP server (image mcp/grafana) wired into
#   booklogr's deploy plane. It is the agent's OBSERVABILITY-READ transport: an
#   MCP-speaking agent reads metrics (PromQL), the firing alert (via the
#   Prometheus datasource's ALERTS series), datasources and dashboards through
#   it. Because an MCP-only agent has NO shell, it has no tool to reach github —
#   the seam is capability-bounded by construction, so retrieval isolation
#   (ADR-0013/ADR-0015) holds without leaning only on the egress allowlist.
#
# REUSE, NOT HAND-ROLL (ADR-0015 / ADR-0018 §3): the official grafana/mcp server.
#
# READ-ONLY (two guards):
#   - `-disable-write` on the server (no create/update/delete tools), AND
#   - Grafana runs anonymous Viewer (docker-compose.yml), so even the transport's
#     credential is read-only — no token to provision.
#   The tool set is scoped to observability reads via `-enabled-tools`.
#
# ISOLATION: attaches to the deploy plane ONLY (same as the agent sandbox) — the
#   forge and load planes are unrouted; the server reaches only grafana:3000.
#
# MODULAR OVERLAY: its own compose project, brought up on demand for agent runs
#   (scripted/reference runs don't need it). Bring up:
#     DEPLOY_NETWORK=booklogr_default \
#       docker compose -p sreforge-mcp -f compose/mcp.yml up -d
#   (booklogr wires this via `pnpm forge mcp booklogr`.) The agent connects to
#   http://grafana-mcp:8000/mcp over the deploy network.
# =============================================================================
name: sreforge-mcp

services:
  grafana-mcp:
    image: mcp/grafana
    container_name: booklogr-grafana-mcp
    command:
      - "-transport=streamable-http"
      - "-address=0.0.0.0:8000"
      - "-disable-write" # read-only guardrail (belt; Grafana anon-Viewer is the suspenders)
      # Scope the surface to observability READS (de-tell + least privilege):
      # datasource discovery + PromQL + firing alerts + dashboards. Everything
      # else (admin, incident, oncall, config, provisioning, loki, …) is off.
      - "-enabled-tools=datasource,prometheus,alerting,dashboard"
      # The agent reaches the server by service DNS, so the Host header is
      # 'grafana-mcp:8000'. The default allowlist is loopback-only and WOULD
      # REJECT that — allow the service name + the dev-published host port.
      - "-allowed-hosts=grafana-mcp:8000,127.0.0.1:8009,localhost:8009"
    environment:
      # Anonymous Viewer is enabled on this Grafana, so no token is needed —
      # unauthenticated requests get read-only Viewer access.
      GRAFANA_URL: "http://grafana:3000"
    ports:
      # Dev/verify ONLY: loopback-published so the host-side verify client can
      # reach it. The AGENT uses the in-network service DNS, not this port.
      - "127.0.0.1:8009:8000"
    networks:
      - deploy_plane
    restart: unless-stopped

# The deploy plane's app network, created by the use-case's deploy compose. We
# ATTACH to it (like the agent sandbox); we do not own or recreate it.
networks:
  deploy_plane:
    external: true
    name: ${DEPLOY_NETWORK:-booklogr_default}
