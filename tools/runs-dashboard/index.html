<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SREForge · Runs</title>
<style>
  /* ── SREForge Runs — private run-data reading room ────────────────────────
     Sibling of tools/dashboard: same ink-navy night-ops base, same cyan
     telemetry accent, same 2px bay rail. This surface only reads — three
     stacked levels (scenarios → runs → one record), no controls, no assets.

     Everything here is a table of evidence, so the whole design budget goes to
     reading one: a real type scale, an 8px spacing rhythm, tabular figures, and
     enough contrast on the small caps that they are actually legible. Two
     inherited details are deliberately corrected rather than copied — see the
     notes at --label and tr.row:hover. */
  :root{
    /* surface */
    --void:#0b0f17; --bay:#121826; --bay2:#0d1220; --inset:#080b12; --well:#06090f;
    --rule:#1d2637; --rule2:#2a3446;
    /* text — --faint is decoration-only (≈3.2:1); --label is the readable
       small-caps tone (≈5.7:1 on --void). The control dashboard uses --faint
       for 9.5px labels, which is under AA; this surface does not. */
    --ink:#e2e8f2; --mute:#8b97ad; --label:#808da6; --faint:#57627a;
    --signal:#57d0e6;              /* cyan telemetry — interactive */
    --nominal:#46c08a; --elevated:#e0a63c; --alarm:#ff5d52;
    --nominal-dim:#1d4a38; --nominal-bed:#0c2018;
    --elevated-dim:#5a4520; --elevated-bed:#221a08;
    --alarm-ink:#ffc7c2;
    --lift:#0e1a24;                /* hover bed */
    --sel:#08222a;                 /* selected bed */
    /* type */
    --mono:"JetBrains Mono","Cascadia Code","SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --fs-micro:9.5px; --fs-tiny:10.5px; --fs-sm:11.5px; --fs-md:12.5px; --fs-lg:15px;
    --ey:.12em;
    /* spacing — 4px base, used everywhere instead of ad-hoc values */
    --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px;
    --rad:4px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--void);color:var(--ink);font-family:var(--mono);font-size:var(--fs-md);
    line-height:1.5;padding-bottom:var(--sp6);-webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;text-rendering:optimizeLegibility}
  .ey{font-size:var(--fs-tiny);letter-spacing:var(--ey);text-transform:uppercase;color:var(--label);font-weight:600}
  a{color:var(--signal);text-decoration:none}
  a:hover{text-decoration:underline;text-underline-offset:3px}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:2px}

  header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp3);
    padding:var(--sp3) var(--sp5);background:linear-gradient(180deg,rgba(11,15,23,.95),rgba(11,15,23,.84));
    backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
  .brand{font-family:var(--sans);font-weight:700;letter-spacing:.16em;font-size:var(--fs-md);
    text-transform:uppercase;color:var(--mute)}
  .brand b{color:var(--ink)} .brand .sep{color:var(--signal);margin:0 var(--sp1)}
  .rail{margin-left:auto;display:flex;align-items:center;gap:var(--sp3)}
  .tag{font-size:var(--fs-micro);letter-spacing:var(--ey);text-transform:uppercase;color:var(--nominal);
    border:1px solid var(--nominal-dim);background:var(--nominal-bed);border-radius:2px;padding:3px var(--sp2)}

  main{max-width:1180px;margin:0 auto;padding:var(--sp5) var(--sp5) 0}
  .storeline{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--sp1) var(--sp3);
    font-size:var(--fs-sm);color:var(--mute);margin-bottom:var(--sp4);
    padding-bottom:var(--sp3);border-bottom:1px solid var(--rule)}
  .storeline .p{color:var(--ink)}
  .storeline .p.path{word-break:break-all}
  .storeline.bad{color:var(--alarm-ink);border-bottom-color:var(--rule2)}

  .bay{position:relative;background:linear-gradient(180deg,var(--bay),var(--bay2));border:1px solid var(--rule);
    border-radius:var(--rad);margin-bottom:var(--sp4);overflow:hidden}
  .bay::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--rule2)}
  .bay.live::before{background:var(--nominal)}
  .bay-hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--sp3);
    padding:var(--sp3) var(--sp4);border-bottom:1px solid var(--rule)}
  .bay-hd .cs{font-size:var(--fs-lg);font-weight:700;letter-spacing:.01em;line-height:1.3}
  .bay-hd .sub{font-size:var(--fs-micro);letter-spacing:var(--ey);text-transform:uppercase;
    color:var(--label);font-weight:600}

  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-sm)}
  th,td{text-align:left;padding:var(--sp2) var(--sp3);white-space:nowrap;
    border-bottom:1px solid var(--rule)}
  th{color:var(--label);font-weight:600;font-size:var(--fs-micro);letter-spacing:var(--ey);
    text-transform:uppercase;position:sticky;top:0;z-index:1;background:var(--inset);
    border-bottom-color:var(--rule2)}
  tbody tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.id{color:var(--mute)}
  td.key{color:var(--ink)}                       /* the column you scan by */
  tr.row{cursor:pointer}
  tr.row td{transition:background .12s ease}
  /* Hover lifts the BED only. The control dashboard also forces color:#fff,
     which erases the verdict colour exactly while you are pointing at it. */
  tr.row:hover td{background:var(--lift)}
  tr.row:hover td.id{color:var(--ink)}
  tr.row.sel td{background:var(--sel)}
  tr.row.sel td:first-child{box-shadow:inset 2px 0 0 var(--signal)}
  /* Rows are focusable (role=button); an offset outline would be clipped by the
     scroll container, so it is inset instead. */
  tr.row:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}

  .vp{color:var(--nominal);font-weight:700}
  .vf{color:var(--alarm);font-weight:700}
  .vr{color:var(--elevated);font-weight:700}
  .kinds{color:var(--faint);font-size:var(--fs-tiny)}
  .kinds b{color:var(--label);font-weight:600}
  .chip{display:inline-block;font-size:var(--fs-micro);letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--rule2);border-radius:2px;padding:1px var(--sp1);color:var(--label);
    margin-right:var(--sp1);vertical-align:1px}
  .chip.decoy{color:var(--elevated);border-color:var(--elevated-dim);background:var(--elevated-bed)}

  /* Signature: the rate meter — the one place a number becomes a shape. Kept to
     a hairline track so a column of them reads as a single instrument. */
  .rate{display:inline-flex;align-items:center;gap:var(--sp2)}
  .rate .pctv{min-width:3.4ch;text-align:right}
  .bar{position:relative;display:inline-block;width:56px;height:6px;background:var(--well);
    border:1px solid var(--rule2);border-radius:2px;vertical-align:middle;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--nominal)}
  .bar.low i{background:var(--alarm)}
  .bar.mid i{background:var(--elevated)}
  .bar.neutral i{background:var(--signal)}

  pre.rec{background:var(--well);margin:0;padding:var(--sp3) var(--sp4);font-size:var(--fs-sm);
    line-height:1.6;tab-size:2;white-space:pre-wrap;word-break:break-word;
    max-height:560px;overflow:auto;color:#c6d0e0}
  .empty{color:var(--label);text-align:center;padding:var(--sp6) var(--sp4);letter-spacing:.04em}
  .err{color:var(--alarm-ink);padding:var(--sp4);line-height:1.55}
  .sha{font-size:var(--fs-micro);color:var(--label);letter-spacing:.02em;word-break:break-all}

  @media (max-width:760px){
    main{padding:var(--sp4) var(--sp4) 0}
    header{padding:var(--sp3) var(--sp4)}
    .rail{margin-left:0;width:100%}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;scroll-behavior:auto !important}
  }
</style>
</head>
<body>
<header>
  <div class="brand">SREForge<span class="sep">/</span><b>Runs</b></div>
  <div class="rail">
    <span class="tag">loopback · not agent-reachable · read-only</span>
  </div>
</header>

<main>
  <div class="storeline" id="storeline">reading store…</div>

  <section class="bay" id="bay-scen">
    <div class="bay-hd"><div class="cs">scenarios</div><div class="sub" id="scen-sub"></div></div>
    <div id="scen"><div class="empty">loading…</div></div>
  </section>

  <section class="bay" id="bay-runs" hidden>
    <div class="bay-hd"><div class="cs" id="runs-title">runs</div><div class="sub" id="runs-sub"></div></div>
    <div id="runs"></div>
  </section>

  <section class="bay" id="bay-rec" hidden>
    <div class="bay-hd"><div class="cs" id="rec-title">record</div><div class="sub sha" id="rec-sha"></div></div>
    <div id="rec"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (r) => r == null ? "—" : (r * 100).toFixed(0) + "%";
const num = (n, d = 3) => n == null ? "—" : Number(n).toFixed(d);
const ts = (s) => s ? String(s).replace("T", " ").replace(/\.\d+Z$/, "Z") : "—";
const dur = (ms) => ms == null ? "—" : ms < 1000 ? ms + "ms" : (ms / 1000).toFixed(0) + "s";
const verdictCls = (v) => v === "passed" ? "vp" : v === "rejected" ? "vr" : "vf";

// The meter is banded only for a pass rate, where higher is unambiguously
// better. A decoy rate reads the other way round, so it stays neutral rather
// than colouring a high value green and implying something we cannot claim.
function bar(r, label) {
  if (r == null) return "";
  const width = Math.round(Math.max(0, Math.min(r, 1)) * 100);
  const band = label !== "pass rate" ? "neutral" : r < 0.5 ? "low" : r < 0.8 ? "mid" : "";
  return `<span class="bar ${band}"><i style="width:${width}%"></i></span>`;
}

const kindsCell = (k) => Object.entries(k || {}).filter(([, n]) => n > 0)
  .map(([name, n]) => `<b>${esc(name)}</b>&nbsp;${n}`).join("&nbsp; ") || "—";

let selectedScenario = null;

// Monotonic token shared by loadRuns and loadRecord. Both panels are filled by
// async fetches, so a slow response must not paint over a newer selection: each
// load captures the token it started with and applies its result only if that
// token is still current. loadRuns bumps it, which also invalidates any record
// fetch still in flight for the scenario the user just left.
let requestToken = 0;

async function getJson(url) {
  let r;
  try {
    r = await fetch(url);            // server stopped / socket refused rejects here
  } catch (e) {
    return { error: `cannot reach the dashboard server (${e.message})` };
  }
  const j = await r.json().catch(() => ({ error: `bad JSON from ${url}` }));
  if (!r.ok && !j.error) j.error = `HTTP ${r.status}`;
  return j;
}

// Honour the OS "reduce motion" setting for the panel reveals.
const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)");
const reveal = (id) =>
  $(id).scrollIntoView({ behavior: reduceMotion?.matches ? "auto" : "smooth", block: "nearest" });

// Rows act as buttons: same navigation from click, Enter, or Space.
function bindRow(tr, go) {
  tr.onclick = go;
  tr.onkeydown = (e) => {
    if (e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
    e.preventDefault();              // Space would otherwise scroll the page
    go();
  };
}

function renderStoreLine(head) {
  const line = $("storeline");
  line.classList.toggle("bad", !head.ok);
  if (!head.ok) { line.innerHTML = `⚠ ${esc(head.error || "store unavailable")}`; return; }
  const bad = (head.unreadable || []).length;
  line.innerHTML = `<span class="ey">store</span><span class="p path">${esc(head.store)}</span>`
    + `<span class="ey">records</span><span class="p">${head.total_records}</span>`
    + (head.index_entries != null ? `<span class="ey">index entries</span><span class="p">${head.index_entries}</span>` : "")
    + (bad ? `<span style="color:var(--elevated)">${bad} unreadable</span>` : "");
}

async function loadSummary() {
  const j = await getJson("/api/summary");
  renderStoreLine(j);
  if (!j.ok) { $("scen").innerHTML = `<div class="err">store not found — ${esc(j.error || "unavailable")}</div>`; return; }
  const rows = j.scenarios || [];
  $("scen-sub").textContent = `${rows.length} scenarios · ${j.total_records} records`;
  $("bay-scen").classList.add("live");
  if (!rows.length) { $("scen").innerHTML = `<div class="empty">no run records in the store</div>`; return; }

  $("scen").innerHTML = `<div class="tblwrap"><table>
    <thead><tr>
      <th scope="col">scenario</th><th scope="col" class="num">runs</th><th scope="col" class="num">passed</th>
      <th scope="col">rate</th><th scope="col" class="num">score median</th>
      <th scope="col">latest run</th><th scope="col">models</th><th scope="col">run kinds</th>
    </tr></thead><tbody>${rows.map((s) => `
      <tr class="row" tabindex="0" role="button" aria-label="runs for ${esc(s.scenario_id)}" data-scenario="${esc(s.scenario_id)}">
        <td class="key">${s.decoy ? '<span class="chip decoy">decoy</span>' : ""}${esc(s.scenario_id)}</td>
        <td class="num">${s.runs}</td>
        <td class="num">${s.passed}</td>
        <td><span class="rate"><span class="pctv">${pct(s.rate)}</span>${bar(s.rate, s.rate_label)}<span class="ey">${esc(s.rate_label)}</span></span></td>
        <td class="num">${num(s.score_median)}</td>
        <td class="id">${esc(ts(s.latest_started_at))}</td>
        <td class="id">${esc((s.models || []).join(", ") || "—")}</td>
        <td class="kinds">${kindsCell(s.kinds)}</td>
      </tr>`).join("")}</tbody></table></div>`;

  $("scen").querySelectorAll("tr.row").forEach((tr) => bindRow(tr, () => loadRuns(tr.dataset.scenario)));
  if (selectedScenario) markSelected("scen", "scenario", selectedScenario);
}

function markSelected(container, attr, value) {
  $(container).querySelectorAll("tr.row").forEach((tr) => tr.classList.toggle("sel", tr.dataset[attr] === value));
}

async function loadRuns(scenario) {
  const token = ++requestToken;   // also invalidates any in-flight record load
  selectedScenario = scenario;
  markSelected("scen", "scenario", scenario);
  $("bay-runs").hidden = false;
  $("bay-rec").hidden = true;
  $("runs-title").textContent = scenario;
  $("runs").innerHTML = `<div class="empty">loading runs…</div>`;

  const j = await getJson("/api/runs?scenario=" + encodeURIComponent(scenario));
  if (token !== requestToken) return;            // a newer selection won
  if (j.error) { $("runs").innerHTML = `<div class="err">${esc(j.error)}</div>`; return; }
  const rows = j.runs || [];
  $("runs-sub").textContent = `${rows.length} runs · newest first`;
  if (!rows.length) { $("runs").innerHTML = `<div class="empty">no runs for this scenario</div>`; return; }

  $("runs").innerHTML = `<div class="tblwrap"><table>
    <thead><tr>
      <th scope="col">run id</th><th scope="col">kind</th><th scope="col">verdict</th><th scope="col" class="num">score</th>
      <th scope="col">started</th><th scope="col" class="num">duration</th>
      <th scope="col">model</th><th scope="col">harness</th><th scope="col">profile</th>
    </tr></thead><tbody>${rows.map((r) => `
      <tr class="row" tabindex="0" role="button" aria-label="record for run ${esc(r.run_id)}" data-sha="${esc(r.sha256)}" data-run="${esc(r.run_id)}">
        <td class="key">${esc(r.run_id)}</td>
        <td class="id">${esc(r.kind)}</td>
        <td class="${verdictCls(r.verdict)}">${esc(r.verdict)}</td>
        <td class="num">${num(r.score)}</td>
        <td class="id">${esc(ts(r.started_at))}</td>
        <td class="num id">${esc(dur(r.duration_ms))}</td>
        <td class="id">${esc(r.model || "—")}</td>
        <td class="id">${esc(r.harness || "—")}</td>
        <td class="id">${esc(r.profile || "—")}</td>
      </tr>`).join("")}</tbody></table></div>`;

  $("runs").querySelectorAll("tr.row").forEach((tr) => bindRow(tr, () => loadRecord(tr.dataset.sha, tr.dataset.run)));
  reveal("bay-runs");
}

async function loadRecord(sha, runId) {
  const token = ++requestToken;
  markSelected("runs", "sha", sha);
  $("bay-rec").hidden = false;
  $("rec-title").textContent = runId || "record";
  $("rec-sha").textContent = sha;
  $("rec").innerHTML = `<div class="empty">loading record…</div>`;

  const j = await getJson("/api/run/" + encodeURIComponent(sha));
  if (token !== requestToken) return;            // a newer row or scenario won
  if (j.error) { $("rec").innerHTML = `<div class="err">${esc(j.error)}</div>`; return; }
  $("rec").innerHTML = `<pre class="rec">${esc(JSON.stringify(j, null, 2))}</pre>`;
  reveal("bay-rec");
}

loadSummary();
</script>
</body>
</html>
