name: Feature request
description: Suggest an idea or improvement for SREForge.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or pain point, not just the solution.
      placeholder: When evaluating an agent across runs I ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like SREForge to do. Sketches and example commands welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have tried or thought about.
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Fit
      description: SREForge is a contamination-controlled evaluation harness — it keeps the rig hidden from the agent under test.
      options:
        - label: This fits SREForge's scope and does not leak the harness to the agent under test.
          required: false
