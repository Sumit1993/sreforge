# Dependabot keeps the HARNESS's own dependencies patched. It is scoped to the
# repo root only — deliberately NOT to use-cases/**, whose apps are the substrate
# under evaluation (some carry intentional regressions) and must never be bumped
# here. The npm ecosystem reads the root pnpm-lock.yaml.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Group only low-risk minor/patch bumps so they can be auto-merged in bulk.
      # Majors are deliberately excluded, so Dependabot opens them individually —
      # one reviewable PR per potentially-breaking change instead of a major
      # hidden inside a grouped PR.
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      # Without update-types the wildcard also groups MAJOR Action bumps, which
      # would park a breaking update inside the group PR and — since the group's
      # reported update-type is the highest change in it — block the whole group
      # from auto-merging. Majors open individually instead, as with npm.
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
