reviews:
  profile: chill
  # Rate-limit discipline. This repo is on CodeRabbit's OSS tier: 1-10 PR reviews per
  # developer per hour, scaling with project popularity — a young repo sits near the
  # bottom. EVERY review run spends one, including the automatic incremental review
  # after each push, so a fix-push loop drains the whole budget on a single PR.
  # Pausing after 1 reviewed commit means one review per PR; push your fixes as a batch,
  # then re-request explicitly with an `@coderabbitai review` comment.
  # Label-gated admission. `enabled: false` turns OFF unconditional automatic
  # review; `labels` re-admits exactly the PRs carrying `coderabbit_review`. Together
  # they make an online review something a PR is ADMITTED to, not something every
  # PR spends budget on. Unlabelled PRs get a "Review skipped" comment instead.
  #
  # Safe only because `review-evidence` is already a REQUIRED check on main
  # (ruleset 18200324). That ordering is load-bearing: with the gate required
  # first, an unreviewed PR is a BLOCKED merge. Flipped the other way round,
  # "unreviewed" would silently become the default and nothing would say so.
  #
  # Evidence for a PR that is never admitted comes from a local CodeRabbit CLI
  # review, which posts a head-SHA-keyed marker the gate accepts.
  #
  # Revert: ~/ai-context/state/sreforge-valve-revert.md (written before this
  # merged, pinned to pre-flip commit dbca60bf). Tracked in prismalens/prismalens#301.
  auto_review:
    enabled: false
    labels:
      - "coderabbit_review"
    auto_pause_after_reviewed_commits: 1
    ignore_title_keywords:
      - "WIP"
  # Not a rate-limit lever (the limit counts reviews, not files) — this keeps PRs under
  # the OSS files-per-review cap of 50-150.
  path_filters:
    - "!pnpm-lock.yaml"
  path_instructions:
    # 1. Docs-drift rule
    - path: "tools/**"
      instructions: "If this PR changes a CLI verb, flag, env var, task name, file layout, prompt surface, or operator workflow, the PR must update the documentation surface that describes the changed behavior — an unrelated docs/ or README change does NOT satisfy the rule; when the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface (docs/src/content/docs/reference/cli.md verb table, run-contract.md, drive-an-agent.mdx, or the nearest README)."
    - path: "use-cases/**/scripts/**"
      instructions: "If this PR changes a CLI verb, flag, env var, task name, file layout, prompt surface, or operator workflow, the PR must update the documentation surface that describes the changed behavior — an unrelated docs/ or README change does NOT satisfy the rule; when the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface (docs/src/content/docs/reference/cli.md verb table, run-contract.md, drive-an-agent.mdx, or the nearest README)."
    - path: "use-cases/**/Taskfile.yml"
      instructions: "If this PR changes a CLI verb, flag, env var, task name, file layout, prompt surface, or operator workflow, the PR must update the documentation surface that describes the changed behavior — an unrelated docs/ or README change does NOT satisfy the rule; when the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface (docs/src/content/docs/reference/cli.md verb table, run-contract.md, drive-an-agent.mdx, or the nearest README)."
    - path: "infra/**"
      instructions: "If this PR changes a CLI verb, flag, env var, task name, file layout, prompt surface, or operator workflow, the PR must update the documentation surface that describes the changed behavior — an unrelated docs/ or README change does NOT satisfy the rule; when the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface (docs/src/content/docs/reference/cli.md verb table, run-contract.md, drive-an-agent.mdx, or the nearest README)."
    - path: "core/src/**"
      instructions: "If this PR changes a CLI verb, flag, env var, task name, file layout, prompt surface, or operator workflow, the PR must update the documentation surface that describes the changed behavior — an unrelated docs/ or README change does NOT satisfy the rule; when the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface (docs/src/content/docs/reference/cli.md verb table, run-contract.md, drive-an-agent.mdx, or the nearest README)."
    # 2. Never-fatal capture
    - path: "core/src/record/**"
      instructions: "Artifact capture (transcript, RCA) is best-effort by invariant (ADR-0027 §9): a capture failure must never abort submission, the sentinel write, or record.json. Flag any change that makes capture fatal — and do NOT propose making it fatal."
    - path: "use-cases/**/scripts/agent-*.{sh,mjs}"
      instructions: "Artifact capture (transcript, RCA) is best-effort by invariant (ADR-0027 §9): a capture failure must never abort submission, the sentinel write, or record.json. Flag any change that makes capture fatal — and do NOT propose making it fatal."
    - path: "infra/agent-sandbox/**"
      instructions: "Artifact capture (transcript, RCA) is best-effort by invariant (ADR-0027 §9): a capture failure must never abort submission, the sentinel write, or record.json. Flag any change that makes capture fatal — and do NOT propose making it fatal."
    # 3. Use-case-agnostic libs
    - path: "tools/doctor/lib.mjs"
      instructions: "This library must stay use-case-agnostic (ADR-0001/0017): flag any hardcoded use-case value (e.g. booklogr names, stack paths) — they belong in the stack scripts' config."
    - path: "tools/certify/lib/**"
      instructions: "This library must stay use-case-agnostic (ADR-0001/0017): flag any hardcoded use-case value (e.g. booklogr names, stack paths) — they belong in the stack scripts' config."
    # 4. Neutral agent-visible text
    - path: "use-cases/**/scenarios/**"
      instructions: "Agent-visible text must read as ordinary operations content — flag eval/harness/grading/oracle/benchmark language (ADR-0008)."
    # 5. Alert rules service label
    - path: "use-cases/**/observability/rules/**"
      instructions: "Every alert rule in rules files MUST carry a `service` label (issue #76); `no_new_alerts` compound oracle grading is scoped by `service`. Flag any alert rule lacking a `service` label."

